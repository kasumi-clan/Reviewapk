name: Build APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Không thấy file .zip trong repo. Hãy upload GodlyMovieReview-phase1.zip vào thư mục gốc."
            exit 1
          fi
          echo "Dùng: $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Trong zip không có settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Vá file test ModelDownloaderTest
        run: |
          cat > "$PROJECT_DIR/app/src/test/java/com/godly/moviereview/ModelDownloaderTest.kt" <<'EOF'
          package com.godly.moviereview

          import com.godly.moviereview.model.ModelDownloader
          import kotlinx.coroutines.runBlocking
          import org.junit.After
          import org.junit.Assert.assertArrayEquals
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Before
          import org.junit.Test
          import java.io.File
          import java.net.InetAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.nio.file.Files
          import kotlin.concurrent.thread

          /** Kiểm thử tải thật qua HTTP cục bộ (ServerSocket), gồm cả tiếp tục tải bằng Range. */
          class ModelDownloaderTest {
              private lateinit var server: ServerSocket
              private lateinit var dir: File
              private val payload = ByteArray(600_000) { (it % 251).toByte() }

              @Volatile
              private var lastRange: String? = null

              @Before
              fun setUp() {
                  dir = Files.createTempDirectory("models").toFile()
                  server = ServerSocket(0, 10, InetAddress.getByName("127.0.0.1"))
                  thread(isDaemon = true) {
                      while (!server.isClosed) {
                          val socket = try {
                              server.accept()
                          } catch (e: Exception) {
                              break
                          }
                          try {
                              handle(socket)
                          } catch (e: Exception) {
                              // client đóng kết nối sớm: bỏ qua
                          }
                      }
                  }
              }

              @After
              fun tearDown() {
                  server.close()
                  dir.deleteRecursively()
              }

              private fun handle(socket: Socket) {
                  socket.use { s ->
                      val reader = s.getInputStream().bufferedReader(Charsets.ISO_8859_1)
                      var range: String? = null
                      while (true) {
                          val line = reader.readLine() ?: break
                          if (line.isEmpty()) break
                          if (line.startsWith("Range:", ignoreCase = true)) {
                              range = line.substringAfter(':').trim()
                          }
                      }
                      lastRange = range

                      val start = range?.removePrefix("bytes=")?.substringBefore('-')?.toIntOrNull()
                      val head: String
                      val body: ByteArray
                      if (start != null) {
                          body = payload.copyOfRange(start, payload.size)
                          head = "HTTP/1.1 206 Partial Content\r\n" +
                              "Content-Range: bytes $start-${payload.size - 1}/${payload.size}\r\n" +
                              "Content-Length: ${body.size}\r\n" +
                              "Connection: close\r\n\r\n"
                      } else {
                          body = payload
                          head = "HTTP/1.1 200 OK\r\n" +
                              "Content-Length: ${body.size}\r\n" +
                              "Connection: close\r\n\r\n"
                      }
                      val out = s.getOutputStream()
                      out.write(head.toByteArray(Charsets.ISO_8859_1))
                      out.write(body)
                      out.flush()
                  }
              }

              private fun url() = "http://127.0.0.1:${server.localPort}/m.bin"

              @Test
              fun downloadsFullFile() {
                  runBlocking {
                      val file = ModelDownloader(dir).download(url(), "m.bin") { }
                      assertArrayEquals(payload, file.readBytes())
                      assertFalse(File(dir, "m.bin.part").exists())
                  }
              }

              @Test
              fun resumesFromPartFile() {
                  runBlocking {
                      File(dir, "m.bin.part").writeBytes(payload.copyOfRange(0, 100_000))
                      val file = ModelDownloader(dir).download(url(), "m.bin") { }
                      assertEquals("bytes=100000-", lastRange)
                      assertArrayEquals(payload, file.readBytes())
                  }
              }
          }
          EOF

      - name: Kiểm tra cấu trúc dự án
        run: |
          cd "$PROJECT_DIR"
          python3 scripts/verify_project.py

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Kiểm tra APK
        run: |
          cd "$PROJECT_DIR"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -n 15
          unzip -l "$APK" | grep "assets/model_manifest.json"
          if unzip -l "$APK" | grep -Ei '\.(gguf|onnx)$|ggml'; then
            echo "APK không được chứa model"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodlyMovieReview-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit test
        run: |
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest --stacktrace

      - name: Upload báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
